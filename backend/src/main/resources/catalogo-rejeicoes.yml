# Catálogo de explicações das rejeições.
#
# Para cada código: título oficial, campo afetado, o que está errado e como corrigir.
# Marcadores aceitos nos textos: {campo}, {encontrado}, {esperado}.
# Para o 225, "motivos" refina o problema e a correção conforme o tipo de erro do XSD.
#
# Títulos conferidos no MOC 7.0, Anexo I (Leiaute e Regras de Validação), em 12/11/2026 (D013).

"243":
  titulo: "Rejeição: XML Mal Formado"  # MOC 7.0, Anexo I
  campo: "Arquivo XML"
  problema: >-
    O arquivo não é um XML bem formado (problema em {encontrado}). Normalmente é
    uma tag aberta sem fechamento, uma tag fechada fora de ordem, um caractere
    especial sem escape (como "&") ou uma declaração DOCTYPE, que não é permitida.
  correcao: >-
    Abra o arquivo num editor de XML, vá até a posição indicada e corrija a sintaxe.
    Se o XML foi editado à mão, gere-o novamente pelo emissor.

"404":
  titulo: "Rejeição: Uso de prefixo de namespace não permitido"  # MOC 7.0, Anexo I
  campo: "{campo}"
  problema: >-
    O elemento foi escrito com prefixo de namespace ("{encontrado}"). A NF-e só
    aceita o namespace padrão, declarado sem prefixo.
  correcao: >-
    Remova o prefixo e declare o namespace como padrão: escreva <{esperado}> em vez
    de <{encontrado}>, com xmlns="http://www.portalfiscal.inf.br/nfe" na raiz
    (ou xmlns="http://www.w3.org/2000/09/xmldsig#" na Signature).

"225":
  titulo: "Rejeição: Falha no Schema XML do lote de NFe"  # MOC 7.0, Anexo I
  campo: "{campo}"
  problema: "O campo {campo} não está de acordo com o schema oficial da NF-e."
  correcao: "Corrija o campo {campo} conforme o leiaute da NF-e 4.00."
  motivos:
    formato:
      problema: "O valor \"{encontrado}\" do campo {campo} não segue o formato exigido."
      correcao: "Informe o campo {campo} no formato definido pelo leiaute (expressão regular {esperado})."
    lista:
      problema: "O valor \"{encontrado}\" não é um dos aceitos para o campo {campo}."
      correcao: "Use um destes valores em {campo}: {esperado}."
    tamanhoMaximo:
      problema: "O campo {campo} tem mais caracteres do que o permitido."
      correcao: "Reduza {campo} para no máximo {esperado} caracteres."
    tamanhoMinimo:
      problema: "O campo {campo} tem menos caracteres do que o exigido."
      correcao: "Informe {campo} com pelo menos {esperado} caracteres."
    tamanhoExato:
      problema: "O campo {campo} não tem o número de caracteres exigido."
      correcao: "Informe {campo} com exatamente {esperado} caracteres."
    tipo:
      problema: "O valor \"{encontrado}\" do campo {campo} não é do tipo esperado ({esperado})."
      correcao: "Informe em {campo} um valor do tipo {esperado}."
    elementoInesperado:
      problema: >-
        O elemento {encontrado} apareceu numa posição em que era esperado: {esperado}.
        Ou falta um campo obrigatório antes dele, ou ele está fora de ordem.
      correcao: "Inclua o campo que falta ({esperado}) ou mova {encontrado} para a posição correta do leiaute."
    elementoFaltando:
      problema: "O grupo {campo} está incompleto: falta o campo {esperado}."
      correcao: "Inclua o campo {esperado} no final do grupo {campo}."
    elementoNaoPermitido:
      problema: "O elemento {encontrado} não é permitido nesta posição; o grupo já está completo."
      correcao: "Remova {encontrado} ou mova-o para o grupo correto."
    textoNaoPermitido:
      problema: "O grupo {campo} contém texto solto, mas só pode conter outros elementos."
      correcao: "Remova o texto de dentro de {campo}, deixando apenas os elementos filhos."
    atributoNaoPermitido:
      problema: "O atributo {encontrado} não é permitido neste elemento."
      correcao: "Remova o atributo {encontrado}."
    atributoFaltando:
      problema: "Falta o atributo obrigatório {esperado}."
      correcao: "Inclua o atributo {esperado} no elemento indicado."
    raizDesconhecida:
      problema: >-
        O elemento raiz {encontrado} não foi reconhecido como uma NF-e. Normalmente o
        namespace está ausente ou errado.
      correcao: >-
        Use <NFe xmlns="http://www.portalfiscal.inf.br/nfe"> como elemento raiz.

"297":
  titulo: "Rejeição: Assinatura difere do calculado"  # MOC 7.0, Anexo I (F02)
  campo: "{campo}"
  problema: "A assinatura digital não confere com o conteúdo da NF-e."
  correcao: "Assine a NF-e novamente, depois de todas as alterações, com o mesmo certificado incluído em KeyInfo."
  motivos:
    conteudoAlterado:
      problema: >-
        O conteúdo da NF-e (infNFe) foi alterado depois da assinatura: o resumo calculado
        não é igual ao DigestValue assinado.
      correcao: >-
        Não edite o XML depois de assinado. Faça a correção no emissor e assine de novo;
        qualquer mudança no infNFe, até de um espaço, invalida a assinatura.
    valorDaAssinatura:
      problema: >-
        O valor da assinatura (SignatureValue) não confere com o SignedInfo e com a chave
        pública do certificado incluído em KeyInfo.
      correcao: >-
        Assine novamente com a chave privada que corresponde ao certificado em KeyInfo e
        não altere o SignatureValue nem o SignedInfo (inclusive o DigestValue) depois disso.

# ---------------------------------------------------------------------------
# Chave de acesso (D008)
# ---------------------------------------------------------------------------

"502":
  titulo: "Rejeição: Erro na Chave de Acesso - Campo Id não corresponde à concatenação dos campos correspondentes"  # MOC 7.0, Anexo I
  campo: "{campo}"
  problema: >-
    O atributo Id ({encontrado}) não corresponde à chave formada pelos campos da NF-e.
    Algum campo que compõe a chave (UF, ano e mês de emissão, CNPJ do emitente, modelo,
    série, número, tipo de emissão, código numérico ou cDV) foi alterado sem atualizar o Id.
  correcao: >-
    Gere a chave de novo a partir dos campos e informe Id="{esperado}". Depois, refaça a
    assinatura, que referencia o Id.

"253":
  titulo: "Rejeição: Digito Verificador da chave de acesso composta inválida"  # MOC 7.0, Anexo I
  campo: "{campo}"
  problema: >-
    O dígito verificador informado em cDV ({encontrado}) não confere com o calculado a
    partir dos campos da chave ({esperado}).
  correcao: >-
    Recalcule o dígito pelo módulo 11 sobre as 43 posições da chave e informe
    cDV = {esperado}. Atualize também o último dígito do Id e refaça a assinatura.

