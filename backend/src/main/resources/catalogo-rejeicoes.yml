"564":
  titulo: "Rejeição: Total do Produto / Serviço difere do somatório dos itens"  # MOC 7.0, Anexo I
  campo: "{campo}"
  problema: >-
    O valor dos produtos (vProd) informado no total da NF-e ({encontrado}) não é igual à soma do vProd dos itens sujeitos ao ICMS que compõem o total (indTot = 1)
    ({esperado}).
  correcao: >-
    Recalcule o total a partir dos itens e informe {campo} = {esperado}, ou corrija o item
    cujo valor está errado. Totais e itens devem ser gerados pelo mesmo cálculo no emissor.

