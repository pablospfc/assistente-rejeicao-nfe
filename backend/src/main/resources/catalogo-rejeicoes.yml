# Identificação
# ---------------------------------------------------------------------------

"703":
  titulo: "Rejeição: Data-Hora de Emissão posterior ao horário de recebimento"  # MOC 7.0, Anexo I
  campo: "{campo}"
  problema: >-
    A data-hora de emissão ({encontrado}) é posterior ao momento da validação ({esperado}),
    além da tolerância de 5 minutos que a SEFAZ aceita pela diferença de relógio.
  correcao: >-
    Confira o relógio e o fuso horário do sistema emissor e informe em dhEmi a data e a
    hora reais da emissão, com o fuso correto (ex.: -03:00).

"207":
  titulo: "Rejeição: CNPJ do emitente inválido"  # MOC 7.0, Anexo I
  campo: "{campo} do emitente"
  problema: >-
    O CNPJ do emitente ({encontrado}) é inválido: os dígitos verificadores não conferem,
    o número está zerado ou o formato está errado.
  correcao: >-
    Informe o CNPJ do emitente com 14 caracteres, sem pontuação, como consta no cadastro.
    No CNPJ alfanumérico, as 12 primeiras posições podem ter letras maiúsculas e as duas
    últimas são sempre dígitos.

"208":
  titulo: "Rejeição: CNPJ do destinatário inválido"  # MOC 7.0, Anexo I
  campo: "{campo} do destinatário"
  problema: >-
    O CNPJ do destinatário ({encontrado}) é inválido: os dígitos verificadores não
    conferem, o número está zerado ou o formato está errado.
  correcao: >-
    Confira o CNPJ do destinatário no cadastro do cliente e informe os 14 caracteres,
    sem pontuação. No CNPJ alfanumérico, as 12 primeiras posições podem ter letras
    maiúsculas e as duas últimas são sempre dígitos.

"237":
  titulo: "Rejeição: CPF do destinatário inválido"  # MOC 7.0, Anexo I
  campo: "{campo} do destinatário"
  problema: >-
    O CPF do destinatário ({encontrado}) é inválido: os dígitos verificadores não
    conferem ou todos os dígitos são iguais.
  correcao: >-
    Confira o CPF no documento do destinatário e informe os 11 dígitos, sem pontuação.

"209":
  titulo: "Rejeição: IE do emitente inválida"  # MOC 7.0, Anexo I
  campo: "{campo} do emitente"
  problema: >-
    A Inscrição Estadual do emitente ({encontrado}) não é válida para a UF {esperado}:
    o formato ou o dígito verificador não confere com a regra dessa UF.
  correcao: >-
    Informe a IE como consta no cadastro estadual, só com dígitos e sem pontuação, ou
    ISENTO se o emitente não tiver inscrição.

"210":
  titulo: "Rejeição: IE do destinatário inválida"  # MOC 7.0, Anexo I
  campo: "{campo} do destinatário"
  problema: >-
    A Inscrição Estadual do destinatário ({encontrado}) não é válida para a UF
    {esperado}: o formato ou o dígito verificador não confere com a regra dessa UF.
  correcao: >-
    Confira a IE no cadastro do cliente e informe só os dígitos. Se o destinatário não
    for contribuinte do ICMS, informe indIEDest = 9 e não preencha a IE.

