"528":
  titulo: "Rejeição: Valor do ICMS difere do produto BC e Alíquota [nItem: 999]"  # MOC 7.0, Anexo I
  campo: "{campo}"
  problema: >-
    O ICMS do item ({encontrado}) não é igual à base de cálculo multiplicada pela
    alíquota ({esperado}), considerando a tolerância de R$ 0,01.
  correcao: >-
    Recalcule o ICMS do item como vBC × pICMS ÷ 100, arredondado para duas casas, e
    informe {campo} = {esperado}. Depois, ajuste o total do ICMS.

"610":
  titulo: "Rejeição: Total da NF difere do somatório dos Valores compõe o valor Total da NF."  # MOC 7.0, Anexo I
  campo: "{campo}"
  problema: >-
    O valor total da NF-e ({encontrado}) não corresponde à soma dos valores que o compõem
    ({esperado}), mesmo considerando a tolerância de R$ 0,50.
  correcao: >-
    Recalcule vNF = vProd − vDesc − vICMSDeson + vST + vFCPST + vFrete + vSeg + vOutro
    + vII + vIPI + vIPIDevol + vServ e informe {campo} = {esperado}. Se a diferença estiver
    numa das parcelas, corrija a parcela.

# ---------------------------------------------------------------------------
# Regras da operação
# ---------------------------------------------------------------------------

"321":
  titulo: "Rejeição: NF-e de devolução de mercadoria não possui documento fiscal referenciado"  # MOC 7.0, Anexo I
  campo: "{campo}"
  problema: >-
    A NF-e tem finalidade de devolução (finNFe = 4), mas não referencia o documento
    fiscal da mercadoria devolvida.
  correcao: >-
    Inclua no grupo NFref a chave da NF-e (refNFe) ou os dados da nota modelo 1, da nota
    de produtor ou do cupom fiscal que originou a operação devolvida.

"598":
  titulo: "Rejeição: NF-e emitida em ambiente de homologação com Razão Social do destinatário diferente de NF-E EMITIDA EM AMBIENTE DE HOMOLOGACAO - SEM VALOR FISCAL"  # MOC 7.0, Anexo I
  campo: "{campo} do destinatário"
  problema: >-
    Em homologação (tpAmb = 2), a razão social do destinatário deve ser o texto padrão,
    mas o XML traz "{encontrado}".
  correcao: >-
    Informe em dest/xNome exatamente "{esperado}". Em produção (tpAmb = 1), use a razão
    social real do destinatário.

"441":
  titulo: "Rejeição: Descrição do pagamento obrigatória para meio de pagamento 99-outros"  # NT 2020.006 v1.30
  campo: "{campo}"
  problema: >-
    O meio de pagamento é 99 (Outros), mas a descrição do meio de pagamento (xPag) não
    foi informada.
  correcao: >-
    Informe em xPag, logo após tPag, a descrição do meio de pagamento usado. Se ele tiver
    código próprio na tabela de meios de pagamento, use esse código em vez de 99.

"327":
  titulo: "Rejeição: CFOP inválido para Nota Fiscal com finalidade de devolução de mercadoria[nItem:nnn]"  # MOC 7.0, Anexo I
  campo: "{campo}"
  problema: >-
    A NF-e tem finalidade de devolução (finNFe = 4), mas o item usa o CFOP {encontrado},
    que não é de devolução de mercadoria na Tabela CFOP do Portal da NF-e (indDevol = 0).
  correcao: >-
    Use um CFOP de devolução compatível com a operação original (ex.: 5.202 ou 6.202 para
    devolução de compra para comercialização). Na devolução de venda para não contribuinte
    (indIEDest = 9), também são aceitos os CFOPs 1.949 e 2.949.

"328":
  titulo: "Rejeição: CFOP de devolução de mercadoria para NF-e que não tem finalidade de devolução de mercadoria [nItem:nnn]"  # MOC 7.0, Anexo I
  campo: "{campo}"
  problema: >-
    O item usa o CFOP {encontrado}, que é de devolução de mercadoria (indDevol = 1 na
    Tabela CFOP), mas a NF-e não tem finalidade de devolução nem é complementar.
  correcao: >-
    Se a operação é uma devolução, informe finNFe = 4 e referencie a nota original em
    NFref. Caso contrário, troque o CFOP pelo da operação realizada (ex.: 5.102 para venda
    de mercadoria adquirida de terceiros).
